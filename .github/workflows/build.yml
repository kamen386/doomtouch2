name: build-apk
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DoomTouch2.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get update && sudo apt-get install -y cmake ninja-build re2c nasm libsdl2-dev libgl1-mesa-dev
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
      - shell: bash
        working-directory: DoomTouch2
        run: bash scripts/build_native.sh 2>&1 | tee native.log
      - working-directory: DoomTouch2
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doomtouch2
          path: |
            DoomTouch2/app/build/outputs/apk/debug/*.apk
            DoomTouch2/native.log
